<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hockey Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Hockey Dashboard</p>
          <h1 id="pageTitle">Owner View</h1>
        </div>
        <div class="header-actions">
          <div id="viewToggle" class="view-toggle hidden" aria-label="Dashboard view switcher">
            <button id="ownerViewBtn" type="button" class="secondary active">Owner View</button>
            <button id="prospectViewBtn" type="button" class="secondary">Prospect Explorer</button>
          </div>
          <button id="backToImportBtn" class="secondary hidden">Upload Another</button>
        </div>
      </header>

      <main id="app" class="app" aria-live="polite"></main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
